server {
  listen 80;
  server_name _;

  # Allow large uploads + stream to backend
  client_max_body_size 100M;

  root /usr/share/nginx/html;
  index index.html;

  # Proxy API — note the trailing slash to strip /api/
  location /api/ {
    proxy_pass http://backend:8000/;     # /api/foo -> backend:8000/foo
    proxy_request_buffering off;         # better for uploads
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # (Optional) PWA-friendly caching
  location = /index.html            { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  location = /manifest.webmanifest  { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  location ~* /(sw\.js|service-worker\.js|workbox-[0-9a-f]+\.js)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback
  location / { try_files $uri /index.html; }
}

